<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoka Lash · Ads Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F0F2F5;
    color: #111;
    font-size: 15px;
  }

  /* ── Header ── */
  header {
    background: #fff;
    border-bottom: 1px solid #E2E5EA;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: #111; }
  .logo span { color: #C8860A; }
  header .spacer { flex: 1; }
  .date-picker {
    font-size: 13px;
    font-family: inherit;
    padding: 7px 12px;
    border: 1px solid #DDE0E6;
    border-radius: 8px;
    background: #F7F8FA;
    color: #333;
    cursor: pointer;
    outline: none;
  }
  .date-picker:focus { border-color: #4A7CF6; }
  .refresh-btn {
    display: flex; align-items: center; gap: 6px;
    background: #4A7CF6; color: #fff;
    border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 13px;
    font-family: inherit; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  .refresh-btn:hover { background: #3A6CE0; }
  .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .refresh-btn.spin svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .last-updated { font-size: 12px; color: #999; }

  /* ── Page wrapper ── */
  .page { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ── Section heading ── */
  .section-heading {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 12px;
    margin-top: 28px;
  }
  .section-heading:first-child { margin-top: 0; }

  /* ── Summary banner ── */
  .summary-banner {
    background: #fff;
    border: 1px solid #E2E5EA;
    border-radius: 14px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    line-height: 1.5;
    color: #333;
  }
  .summary-banner .emoji { font-size: 22px; flex-shrink: 0; }
  .summary-banner strong { color: #111; }

  /* ── KPI row ── */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
    gap: 12px;
  }
  .kpi {
    background: #fff;
    border: 1px solid #E2E5EA;
    border-radius: 14px;
    padding: 18px 20px 16px;
    position: relative;
  }
  .kpi-icon {
    font-size: 20px;
    margin-bottom: 8px;
  }
  .kpi-number {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: #111;
  }
  .kpi-number.green { color: #1A8A4A; }
  .kpi-number.amber { color: #B06D10; }
  .kpi-label {
    margin-top: 5px;
    font-size: 13px;
    font-weight: 600;
    color: #555;
  }
  .kpi-sub {
    margin-top: 3px;
    font-size: 12px;
    color: #999;
  }
  .kpi-badge {
    position: absolute;
    top: 14px; right: 14px;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .badge-green { background: #DFFBEC; color: #1A8A4A; }
  .badge-amber { background: #FFF3DC; color: #B06D10; }
  .badge-red   { background: #FFE8E8; color: #C0392B; }

  /* ── Campaign cards ── */
  .campaigns { display: flex; flex-direction: column; gap: 12px; }

  .campaign-card {
    background: #fff;
    border: 1px solid #E2E5EA;
    border-radius: 14px;
    overflow: hidden;
  }
  .campaign-top {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px 16px;
    border-bottom: 1px solid #F0F2F5;
  }
  .status-light {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .light-green { background: #22C55E; box-shadow: 0 0 0 3px #DCFCE7; }
  .light-grey  { background: #CBD5E1; }
  .campaign-name {
    font-size: 16px;
    font-weight: 700;
    color: #111;
    flex: 1;
  }
  .campaign-status-text {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .status-active { background: #DFFBEC; color: #1A8A4A; }
  .status-paused { background: #F1F3F5; color: #888; }

  .campaign-metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0;
  }
  .cm {
    padding: 14px 20px;
    border-right: 1px solid #F0F2F5;
  }
  .cm:last-child { border-right: none; }
  .cm-value {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.8px;
    color: #111;
    font-variant-numeric: tabular-nums;
  }
  .cm-value.green { color: #1A8A4A; }
  .cm-value.amber { color: #B06D10; }
  .cm-value.red   { color: #C0392B; }
  .cm-label {
    font-size: 11px;
    color: #999;
    margin-top: 2px;
  }
  .cm-hint {
    font-size: 11px;
    color: #AAA;
    margin-top: 1px;
  }

  /* ROAS visual bar */
  .roas-bar-row {
    padding: 10px 20px 14px;
    border-top: 1px solid #F0F2F5;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .roas-bar-track {
    flex: 1;
    height: 6px;
    background: #F0F2F5;
    border-radius: 3px;
    overflow: hidden;
  }
  .roas-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }
  .fill-green { background: #22C55E; }
  .fill-amber { background: #F59E0B; }
  .fill-red   { background: #EF4444; }
  .roas-bar-label {
    font-size: 12px;
    font-weight: 600;
    color: #888;
    white-space: nowrap;
  }

  /* ── Adset table — simplified ── */
  .adset-list { display: flex; flex-direction: column; gap: 8px; }
  .adset-row {
    background: #fff;
    border: 1px solid #E2E5EA;
    border-radius: 12px;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
    align-items: center;
    padding: 14px 20px;
    gap: 8px;
  }
  .adset-row.header-row {
    background: transparent;
    border: none;
    padding: 0 20px 6px;
    font-size: 11px;
    font-weight: 700;
    color: #AAA;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .adset-name { font-weight: 600; font-size: 14px; color: #111; }
  .adset-campaign { font-size: 11px; color: #999; margin-top: 2px; }
  .adset-val {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #111;
    text-align: right;
  }
  .adset-val.green { color: #1A8A4A; }
  .adset-val.amber { color: #B06D10; }

  /* ── Insight callouts ── */
  .insights { display: flex; flex-direction: column; gap: 10px; }
  .insight-card {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: #fff;
    border: 1px solid #E2E5EA;
    border-left: 4px solid #4A7CF6;
    border-radius: 12px;
    padding: 16px 18px;
  }
  .insight-card.warn { border-left-color: #F59E0B; }
  .insight-card.good { border-left-color: #22C55E; }
  .insight-emoji { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
  .insight-title { font-size: 14px; font-weight: 700; color: #111; margin-bottom: 3px; }
  .insight-body  { font-size: 13px; color: #555; line-height: 1.5; }

  /* ── No token ── */
  .setup-card {
    background: #fff;
    border: 1px solid #E2E5EA;
    border-radius: 14px;
    padding: 36px 32px;
    text-align: center;
    max-width: 560px;
    margin: 40px auto;
  }
  .setup-card h2 { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
  .setup-card p  { color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
  .setup-steps {
    text-align: left;
    background: #F7F8FA;
    border-radius: 10px;
    padding: 18px 20px;
    font-size: 13px;
    line-height: 2;
    color: #333;
  }
  .setup-steps ol { padding-left: 18px; }
  .setup-steps code {
    background: #EAECF0;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-family: 'SF Mono', monospace;
  }

  /* ── Skeleton ── */
  .skeleton {
    background: linear-gradient(90deg, #ECEEF2 25%, #F5F6F8 50%, #ECEEF2 75%);
    background-size: 200% 100%;
    animation: shimmer 1.3s infinite;
    border-radius: 10px;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  @media (max-width: 700px) {
    header { flex-wrap: wrap; gap: 8px; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .campaign-metrics { grid-template-columns: repeat(2, 1fr); }
    .adset-row { grid-template-columns: 1fr 1fr; }
    .adset-row.header-row { display: none; }
    .last-updated { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Hoka<span>Lash</span> · Ads</div>
  <div class="spacer"></div>
  <select class="date-picker" id="datePicker" onchange="load()">
    <option value="last_7d">Last 7 days</option>
    <option value="last_30d" selected>Last 30 days</option>
    <option value="last_90d">Last 90 days</option>
    <option value="this_month">This month</option>
    <option value="last_month">Last month</option>
  </select>
  <button class="refresh-btn" id="refreshBtn" onclick="load(true)">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
      <path d="M11.5 1.5C10.3 0.4 8.7 -0.2 6.9 0C3.5 0.4 0.9 3.2 0.9 6.5C0.9 10 3.7 12.8 7.2 12.8C9.9 12.8 12.2 11.1 13 8.7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M13 0.5V4.5H9" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Refresh
  </button>
  <div class="last-updated" id="lastUpdated"></div>
</header>

<div class="page" id="page">
  <div style="padding:60px 0;text-align:center;color:#999">Loading your data…</div>
</div>

<script>
  /* ── helpers ── */
  const $ = id => document.getElementById(id);

  function money(n)  { return n == null ? '—' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2}); }
  function whole(n)  { return n == null ? '—' : Number(n).toLocaleString('en-US', {maximumFractionDigits:0}); }
  function pct(n)    { return n == null ? '—' : Number(n).toFixed(2) + '%'; }
  function rx(n)     { return n == null ? '—' : Number(n).toFixed(2) + '×'; }
  function shortN(n) {
    if (n == null) return '—';
    if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
    if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
    return String(n);
  }
  function roasColor(v) { return v >= 3 ? 'green' : v >= 1.5 ? 'amber' : 'red'; }
  function roasBarClass(v) { return v >= 3 ? 'fill-green' : v >= 1.5 ? 'fill-amber' : 'fill-red'; }
  function roasBarW(v)  { return Math.min(100, (v/5)*100).toFixed(1); }
  function ctrColor(v)  { return v >= 3 ? 'green' : v >= 1 ? '' : 'amber'; }

  /* ── render no-token ── */
  function noToken() {
    $('page').innerHTML = `
      <div class="setup-card">
        <div style="font-size:36px;margin-bottom:12px">🔑</div>
        <h2>Connect your Meta Ads account</h2>
        <p>Add your Meta access token once and the dashboard will always show live data.</p>
        <div class="setup-steps">
          <ol>
            <li>Go to <strong>Meta Business Settings → System Users</strong></li>
            <li>Click <strong>Generate New Token</strong></li>
            <li>Select permissions: <code>ads_read</code> + <code>ads_management</code></li>
            <li>Add to your <code>.env</code> file:<br>
              <code>META_ACCESS_TOKEN=paste_token_here</code></li>
            <li>Restart: <code>npm start</code></li>
          </ol>
        </div>
      </div>`;
  }

  /* ── render error ── */
  function renderError(msg) {
    $('page').innerHTML = `
      <div class="setup-card">
        <div style="font-size:36px;margin-bottom:12px">⚠️</div>
        <h2>Couldn't load data</h2>
        <p>${msg}</p>
        <p style="color:#999;font-size:13px;margin-top:8px">Check your <code style="background:#f0f0f0;padding:2px 6px;border-radius:4px">META_ACCESS_TOKEN</code> is valid.</p>
      </div>`;
  }

  /* ── render dashboard ── */
  function render(d) {
    const a = d.account;
    const active = d.campaigns.filter(c => c.status === 'ACTIVE' && c.spend > 0);
    const paused = d.campaigns.filter(c => c.status !== 'ACTIVE');

    /* ── Summary sentence ── */
    const roasOk = a.roas >= 3;
    const summaryEmoji = roasOk ? '✅' : '⚠️';
    const summaryText = roasOk
      ? `Your ads are <strong>profitable</strong>. You spent <strong>${money(a.spend)}</strong> and made <strong>${whole(a.purchases)} purchases</strong> at a <strong>${rx(a.roas)} return on ad spend</strong> over the selected period.`
      : `Your ads spent <strong>${money(a.spend)}</strong> and generated <strong>${whole(a.purchases)} purchases</strong>. ROAS is <strong>${rx(a.roas)}</strong> — consider reviewing your campaigns.`;

    /* ── KPI cards ── */
    const kpiCards = [
      { icon:'💰', num: money(a.spend),          label:'Total Spent',        sub:'Money spent on ads',           color:'', badge:'' },
      { icon:'🛒', num: whole(a.purchases),       label:'Purchases Made',     sub:'People who bought',            color:'green', badge:'' },
      { icon:'📈', num: rx(a.roas),               label:'Return on Ad Spend', sub:`For every $1 spent`,          color: a.roas >= 3 ? 'green' : 'amber', badge: a.roas >= 3 ? {cls:'badge-green',txt:'Good'} : {cls:'badge-amber',txt:'Watch'} },
      { icon:'💸', num: money(a.cost_per_purchase),label:'Cost Per Purchase', sub:'Avg to get 1 sale',           color: a.cost_per_purchase && a.cost_per_purchase < 25 ? 'green' : 'amber', badge:'' },
      { icon:'👁️', num: shortN(a.impressions),    label:'Times Ad Was Seen',  sub:`Reached ${shortN(a.reach)} people`, color:'', badge:'' },
      { icon:'👆', num: pct(a.ctr),               label:'Click-Through Rate', sub:`${whole(a.clicks)} clicks total`, color: a.ctr >= 3 ? 'green' : '', badge:'' },
    ].map(k => `
      <div class="kpi">
        <div class="kpi-icon">${k.icon}</div>
        <div class="kpi-number ${k.color}">${k.num}</div>
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-sub">${k.sub}</div>
        ${k.badge ? `<div class="kpi-badge ${k.badge.cls}">${k.badge.txt}</div>` : ''}
      </div>`).join('');

    /* ── Campaign cards ── */
    const campaignCards = active.length ? active.map(c => {
      const rc = roasColor(c.roas);
      return `
      <div class="campaign-card">
        <div class="campaign-top">
          <div class="status-light light-green"></div>
          <div class="campaign-name">${c.name}</div>
          <div class="campaign-status-text status-active">● Running</div>
        </div>
        <div class="campaign-metrics">
          <div class="cm">
            <div class="cm-value ${rc}">${rx(c.roas)}</div>
            <div class="cm-label">Return on Spend</div>
            <div class="cm-hint">${rc==='green'?'Profitable 🟢':rc==='amber'?'Break-even ⚠️':'Losing money 🔴'}</div>
          </div>
          <div class="cm">
            <div class="cm-value">${money(c.spend)}</div>
            <div class="cm-label">Spent</div>
          </div>
          <div class="cm">
            <div class="cm-value green">${whole(c.purchases)}</div>
            <div class="cm-label">Purchases</div>
          </div>
          <div class="cm">
            <div class="cm-value">${money(c.cost_per_purchase)}</div>
            <div class="cm-label">Cost per Purchase</div>
          </div>
          <div class="cm">
            <div class="cm-value ${ctrColor(c.ctr)}">${pct(c.ctr)}</div>
            <div class="cm-label">Click Rate</div>
            <div class="cm-hint">${shortN(c.clicks)} clicks</div>
          </div>
          <div class="cm">
            <div class="cm-value">${shortN(c.impressions)}</div>
            <div class="cm-label">Times Seen</div>
          </div>
        </div>
        <div class="roas-bar-row">
          <span class="roas-bar-label">ROAS ${rx(c.roas)}</span>
          <div class="roas-bar-track">
            <div class="roas-bar-fill ${roasBarClass(c.roas)}" style="width:${roasBarW(c.roas)}%"></div>
          </div>
          <span class="roas-bar-label">${c.daily_budget ? money(c.daily_budget)+'/day' : ''}</span>
        </div>
      </div>`}).join('')
      : `<div style="background:#fff;border:1px solid #E2E5EA;border-radius:14px;padding:32px;text-align:center;color:#999">No active campaigns in this period.</div>`;

    /* ── paused count line ── */
    const pausedLine = paused.length
      ? `<div style="background:#fff;border:1px solid #E2E5EA;border-radius:12px;padding:14px 20px;font-size:13px;color:#888;margin-top:8px">
          <strong style="color:#333">${paused.length} paused campaigns</strong> — not spending. Examples: ${paused.slice(0,3).map(c=>c.name).join(', ')}${paused.length>3?'…':''}.
        </div>` : '';

    /* ── Ad sets ── */
    const adsetRows = d.adsets.map(a => `
      <div class="adset-row">
        <div>
          <div class="adset-name">${a.name}</div>
          <div class="adset-campaign">${a.campaign||''}</div>
        </div>
        <div class="adset-val">${money(a.spend)}</div>
        <div class="adset-val ${roasColor(a.roas)}">${rx(a.roas)}</div>
        <div class="adset-val green">${whole(a.purchases)}</div>
        <div class="adset-val ${ctrColor(a.ctr)}">${pct(a.ctr)}</div>
        <div class="adset-val">${money(a.cost_per_purchase)}</div>
      </div>`).join('');

    /* ── Insights / recommendations ── */
    const insights = [];
    if (a.roas >= 3) insights.push({type:'good', emoji:'🏆', title:'Your ads are profitable', body:`You're earning ${rx(a.roas)} for every dollar spent. That means for every $1 you put into ads, you're getting $${Number(a.roas).toFixed(2)} back.`});
    const bestCampaign = active.sort((a,b)=>(b.roas||0)-(a.roas||0))[0];
    if (bestCampaign) insights.push({type:'good', emoji:'⭐', title:`Best campaign: ${bestCampaign.name}`, body:`This campaign has the highest return at ${rx(bestCampaign.roas)} ROAS with ${whole(bestCampaign.purchases)} purchases. Consider increasing its budget.`});
    const worstCampaign = [...active].sort((a,b)=>(a.roas||0)-(b.roas||0))[0];
    if (worstCampaign && active.length > 1 && worstCampaign.roas < 2) insights.push({type:'warn', emoji:'⚠️', title:`Watch: ${worstCampaign.name}`, body:`This campaign's return (${rx(worstCampaign.roas)}) is below ideal. You're spending ${money(worstCampaign.spend)} but getting limited results.`});
    if (a.ctr < 2) insights.push({type:'warn', emoji:'📉', title:'Low click-through rate', body:`Your ads are being seen but only ${pct(a.ctr)} of people click. Consider refreshing your ad creatives or copy.`});
    insights.push({type:'info', emoji:'💡', title:'5 ways to improve your score', body:'Meta flagged: merge duplicate ad sets, enable Shops Ads, improve Conversions API coverage, switch to Maximize Conversions, and try AI-generated creative variations.'});

    const insightCards = insights.map(i => `
      <div class="insight-card ${i.type==='warn'?'warn':i.type==='good'?'good':''}">
        <div class="insight-emoji">${i.emoji}</div>
        <div>
          <div class="insight-title">${i.title}</div>
          <div class="insight-body">${i.body}</div>
        </div>
      </div>`).join('');

    /* ── Assemble ── */
    $('page').innerHTML = `
      <div class="summary-banner">
        <div class="emoji">${summaryEmoji}</div>
        <div>${summaryText}</div>
      </div>

      <div class="section-heading" style="margin-top:24px">Your Numbers at a Glance</div>
      <div class="kpi-row">${kpiCards}</div>

      <div class="section-heading">Active Campaigns</div>
      <div class="campaigns">${campaignCards}</div>
      ${pausedLine}

      ${d.adsets.length ? `
      <div class="section-heading">Ad Sets Breakdown</div>
      <div class="adset-row header-row">
        <div>Ad Set</div>
        <div style="text-align:right">Spent</div>
        <div style="text-align:right">ROAS</div>
        <div style="text-align:right">Purchases</div>
        <div style="text-align:right">Click Rate</div>
        <div style="text-align:right">Cost/Purchase</div>
      </div>
      <div class="adset-list">${adsetRows}</div>` : ''}

      <div class="section-heading">Insights & Actions</div>
      <div class="insights">${insightCards}</div>
    `;
  }

  /* ── fetch ── */
  async function load(forceRefresh = false) {
    const btn = $('refreshBtn');
    btn.disabled = true;
    btn.classList.add('spin');
    const preset = $('datePicker').value;
    try {
      const res  = await fetch(`/api/dashboard?date_preset=${preset}&_=${Date.now()}`);
      const data = await res.json();
      if (data.error === 'NO_TOKEN') return noToken();
      if (data.error) return renderError(data.message);
      render(data);
      $('lastUpdated').textContent = 'Updated ' + new Date(data.fetched_at).toLocaleTimeString();
    } catch(e) {
      renderError('Network error: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.classList.remove('spin');
    }
  }

  load();
</script>
</body>
</html>
