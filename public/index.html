<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoka Lash · Meta Ads</title>
<style>
  :root {
    --bg: #F7F6F3;
    --white: #FFFFFF;
    --border: #E5E3DD;
    --text: #1A1916;
    --muted: #888580;
    --sub: #BBB8B2;
    --green: #1D7A4E;
    --green-bg: #EBF7F1;
    --amber: #A05C10;
    --amber-bg: #FDF3E3;
    --red: #B93333;
    --red-bg: #FDEAEA;
    --gold: #8B6914;
    --gold-bg: #FBF4E2;
    --blue: #1E5FA8;
    --blue-bg: #EBF2FC;
    --accent: #2B5CE6;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    font-size: 14px;
  }

  /* ── Top bar ── */
  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-brand {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  .topbar-sub {
    font-size: 12px;
    color: var(--muted);
  }
  .topbar-spacer { flex: 1; }

  .date-select {
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 10px;
    cursor: pointer;
    outline: none;
  }
  .date-select:focus { border-color: var(--accent); }

  .refresh-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    color: var(--white);
    background: var(--accent);
    border: none;
    border-radius: 7px;
    padding: 7px 14px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .refresh-btn:hover { opacity: 0.88; }
  .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .refresh-btn svg { transition: transform 0.4s; }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .updated-at {
    font-size: 11px;
    color: var(--sub);
    white-space: nowrap;
  }

  /* ── Layout ── */
  .page { max-width: 1240px; margin: 0 auto; padding: 28px 24px 60px; }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .space { margin-bottom: 28px; }

  /* ── Error / loading states ── */
  .state-banner {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
    text-align: center;
  }
  .state-banner h2 { font-size: 18px; margin-bottom: 8px; }
  .state-banner p { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .state-banner code {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 13px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--text);
  }
  .token-steps {
    text-align: left;
    display: inline-block;
    margin-top: 16px;
    background: var(--bg);
    border-radius: 10px;
    padding: 18px 22px;
    font-size: 13px;
    color: var(--text);
    line-height: 2;
  }
  .token-steps ol { padding-left: 18px; }
  .token-steps a { color: var(--accent); }

  /* ── KPI grid ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
  }
  .kpi-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 16px;
  }
  .kpi-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .kpi-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -1.5px;
    color: var(--text);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .kpi-sub {
    margin-top: 5px;
    font-size: 12px;
    color: var(--muted);
  }
  .kpi-value.big-green { color: var(--green); }
  .kpi-value.big-gold  { color: var(--gold); }

  /* ── Campaign cards ── */
  .campaign-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 14px;
  }
  .campaign-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .campaign-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 16px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
  }
  .dot-active { background: #22C55E; }
  .dot-paused { background: var(--sub); }
  .dot-warn   { background: #F59E0B; }
  .campaign-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    flex: 1;
  }
  .campaign-obj {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .campaign-roas {
    text-align: right;
    flex-shrink: 0;
  }
  .roas-big {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--green);
    font-variant-numeric: tabular-nums;
  }
  .roas-label { font-size: 10px; color: var(--muted); }

  .campaign-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .metric-item { }
  .metric-val {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .metric-lbl {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }

  .roas-bar-wrap {
    margin-top: 14px;
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .roas-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #22C55E, #16A34A);
    transition: width 0.6s ease;
  }
  .roas-bar-fill.amber { background: linear-gradient(90deg, #F59E0B, #D97706); }
  .roas-bar-fill.red   { background: linear-gradient(90deg, #EF4444, #DC2626); }

  /* ── Full-width table card ── */
  .table-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .table-card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .table-card-title { font-size: 14px; font-weight: 600; }
  .table-card-meta { font-size: 12px; color: var(--muted); margin-left: auto; }
  .table-scroll { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }
  thead th {
    padding: 10px 16px;
    text-align: left;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th:not(:first-child) { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #FAFAF8; }
  tbody td { padding: 11px 16px; color: var(--text); white-space: nowrap; }
  tbody td:not(:first-child) { text-align: right; }
  .td-name { font-weight: 500; }
  .td-sub  { font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* chips */
  .chip {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 5px;
    letter-spacing: 0.2px;
  }
  .chip-green  { background: var(--green-bg);  color: var(--green); }
  .chip-amber  { background: var(--amber-bg);  color: var(--amber); }
  .chip-red    { background: var(--red-bg);    color: var(--red); }
  .chip-grey   { background: var(--border);    color: var(--muted); }
  .chip-blue   { background: var(--blue-bg);   color: var(--blue); }

  .good { color: var(--green); font-weight: 600; }
  .warn { color: var(--amber); font-weight: 600; }

  /* ── Paused summary ── */
  .paused-summary {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .paused-num {
    font-size: 32px;
    font-weight: 700;
    color: var(--sub);
    letter-spacing: -2px;
    line-height: 1;
  }

  /* ── Skeleton loader ── */
  .skeleton {
    background: linear-gradient(90deg, #EEECEA 25%, #F7F6F3 50%, #EEECEA 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 8px;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  @media (max-width: 700px) {
    .topbar { padding: 0 16px; gap: 8px; }
    .topbar-sub { display: none; }
    .page { padding: 16px 12px 40px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .campaign-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div>
    <div class="topbar-brand">Hoka Lash</div>
    <div class="topbar-sub">Meta Ads Dashboard</div>
  </div>
  <div class="topbar-spacer"></div>
  <select class="date-select" id="dateSelect" onchange="loadData()">
    <option value="last_7d">Last 7 days</option>
    <option value="last_30d" selected>Last 30 days</option>
    <option value="last_90d">Last 90 days</option>
    <option value="this_month">This month</option>
    <option value="last_month">Last month</option>
  </select>
  <button class="refresh-btn" id="refreshBtn" onclick="loadData(true)">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12.5 2.5C11.2 1.1 9.2 0.25 7 0.25C3.27 0.25 0.25 3.27 0.25 7s3.02 6.75 6.75 6.75c3.15 0 5.79-2.15 6.53-5.06" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M13.75 0.25v4h-4" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Refresh
  </button>
  <div class="updated-at" id="updatedAt"></div>
</div>

<!-- PAGE -->
<div class="page" id="page">
  <!-- content injected by JS -->
</div>

<script>
  let lastData = null;

  function fmt(n, decimals = 0) {
    if (n == null || isNaN(n)) return '—';
    return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  function money(n) {
    if (n == null || isNaN(n)) return '—';
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function pct(n) {
    if (n == null || isNaN(n)) return '—';
    return n.toFixed(2) + '%';
  }
  function roas(n) {
    if (n == null || isNaN(n)) return '—';
    return n.toFixed(2) + '×';
  }
  function statusChip(s) {
    if (!s) return '';
    const map = {
      'ACTIVE': ['chip-green', 'Active'],
      'PAUSED': ['chip-grey', 'Paused'],
      'LEARNING': ['chip-blue', 'Learning'],
      'LEARNING_LIMITED': ['chip-amber', 'Budget Limited'],
      'CAMPAIGN_PAUSED': ['chip-grey', 'Campaign Paused'],
      'WITH_ISSUES': ['chip-red', 'Issues'],
      'DELETED': ['chip-grey', 'Deleted'],
    };
    const [cls, label] = map[s] || ['chip-grey', s];
    return `<span class="chip ${cls}">${label}</span>`;
  }
  function roasColor(v) {
    if (v == null) return '';
    if (v >= 3) return 'good';
    if (v >= 1.5) return 'warn';
    return '';
  }
  function roasBarClass(v) {
    if (v == null) return '';
    if (v >= 3) return '';
    if (v >= 1.5) return 'amber';
    return 'red';
  }
  function roasBarWidth(v) {
    if (v == null) return 0;
    // treat 5× as 100%
    return Math.min(100, (v / 5) * 100);
  }
  function shortNum(n) {
    if (n == null) return '—';
    if (n >= 1_000_000) return (n/1_000_000).toFixed(1) + 'M';
    if (n >= 1_000) return (n/1_000).toFixed(1) + 'K';
    return String(n);
  }

  function renderNoToken() {
    document.getElementById('page').innerHTML = `
      <div class="state-banner">
        <h2>⚙️ One-time setup needed</h2>
        <p>To fetch live Meta Ads data, add your access token to <code>.env</code> in the project folder and restart the server.</p>
        <div class="token-steps">
          <strong>How to get your Meta access token:</strong>
          <ol>
            <li>Go to <a href="https://business.facebook.com/settings/system-users" target="_blank">Meta Business Settings → System Users</a></li>
            <li>Create or select a System User → click <strong>Generate New Token</strong></li>
            <li>Grant <strong>ads_read</strong> and <strong>ads_management</strong> permissions</li>
            <li>Copy the token and add it to your <code>.env</code> file:</li>
          </ol>
          <br>
          <code style="display:block;padding:12px;margin-top:4px;line-height:1.8">
            META_ACCESS_TOKEN=your_token_here<br>
            META_AD_ACCOUNT_ID=313827266010023
          </code>
          <br>
          Then restart: <code>npm start</code>
        </div>
      </div>`;
  }

  function renderError(msg) {
    document.getElementById('page').innerHTML = `
      <div class="state-banner">
        <h2>⚠️ Could not fetch data</h2>
        <p>${msg}</p>
        <p style="margin-top:8px">Check that your <code>META_ACCESS_TOKEN</code> is valid and hasn't expired.</p>
      </div>`;
  }

  function renderLoading() {
    document.getElementById('page').innerHTML = `
      <div class="kpi-grid space">
        ${Array(6).fill('<div class="kpi-card"><div class="skeleton" style="height:60px"></div></div>').join('')}
      </div>
      <div class="campaign-grid space">
        ${Array(3).fill('<div class="campaign-card"><div class="skeleton" style="height:120px"></div></div>').join('')}
      </div>`;
  }

  function renderDashboard(d) {
    const a = d.account;
    const activeCampaigns = d.campaigns.filter(c => c.status === 'ACTIVE' && c.spend > 0);
    const pausedCount = d.campaigns.filter(c => c.status === 'PAUSED').length;

    // KPI cards
    const kpis = `
      <div class="kpi-card">
        <div class="kpi-label">Total Spend</div>
        <div class="kpi-value">${money(a.spend)}</div>
        <div class="kpi-sub">${activeCampaigns.length} active campaigns</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Purchases</div>
        <div class="kpi-value big-green">${fmt(a.purchases)}</div>
        <div class="kpi-sub">${money(a.cost_per_purchase)} per purchase</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">ROAS</div>
        <div class="kpi-value big-gold">${roas(a.roas)}</div>
        <div class="kpi-sub">Return on ad spend</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Impressions</div>
        <div class="kpi-value">${shortNum(a.impressions)}</div>
        <div class="kpi-sub">${shortNum(a.reach)} unique reach</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Clicks</div>
        <div class="kpi-value">${shortNum(a.clicks)}</div>
        <div class="kpi-sub">${pct(a.ctr)} click-through rate</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Avg CPC</div>
        <div class="kpi-value">${money(a.cpc)}</div>
        <div class="kpi-sub">${money(a.cpm)} CPM</div>
      </div>`;

    // Campaign cards
    const campaignCards = activeCampaigns.length
      ? activeCampaigns.map(c => `
        <div class="campaign-card">
          <div class="campaign-header">
            <div class="status-dot dot-active"></div>
            <div>
              <div class="campaign-name">${c.name}</div>
              <div class="campaign-obj">${(c.objective||'').replace('OUTCOME_','').replace('_',' ')}${c.daily_budget ? ' · $' + fmt(c.daily_budget) + '/day' : ''}</div>
            </div>
            <div class="campaign-roas">
              <div class="roas-big ${roasColor(c.roas)}">${roas(c.roas)}</div>
              <div class="roas-label">ROAS</div>
            </div>
          </div>
          <div class="campaign-metrics">
            <div class="metric-item">
              <div class="metric-val">${money(c.spend)}</div>
              <div class="metric-lbl">Spend</div>
            </div>
            <div class="metric-item">
              <div class="metric-val">${fmt(c.purchases)}</div>
              <div class="metric-lbl">Purchases</div>
            </div>
            <div class="metric-item">
              <div class="metric-val">${money(c.cost_per_purchase)}</div>
              <div class="metric-lbl">Cost / Purchase</div>
            </div>
            <div class="metric-item">
              <div class="metric-val">${shortNum(c.impressions)}</div>
              <div class="metric-lbl">Impressions</div>
            </div>
            <div class="metric-item">
              <div class="metric-val">${pct(c.ctr)}</div>
              <div class="metric-lbl">CTR</div>
            </div>
            <div class="metric-item">
              <div class="metric-val">${money(c.cpc)}</div>
              <div class="metric-lbl">CPC</div>
            </div>
          </div>
          <div class="roas-bar-wrap">
            <div class="roas-bar-fill ${roasBarClass(c.roas)}" style="width:${roasBarWidth(c.roas)}%"></div>
          </div>
        </div>`).join('')
      : '<div class="state-banner"><p>No active campaigns found for this date range.</p></div>';

    // Ad sets table
    const adsetRows = d.adsets.map(a => `
      <tr>
        <td>
          <div class="td-name">${a.name}</div>
          <div class="td-sub">${a.campaign || ''}</div>
        </td>
        <td>${statusChip(a.status)}</td>
        <td>${money(a.spend)}</td>
        <td>${shortNum(a.impressions)}</td>
        <td class="${a.ctr >= 4 ? 'good' : ''}">${pct(a.ctr)}</td>
        <td>${money(a.cpc)}</td>
        <td>${fmt(a.frequency, 2)}</td>
        <td>${fmt(a.purchases)}</td>
        <td>${money(a.cost_per_purchase)}</td>
        <td class="${roasColor(a.roas)}">${roas(a.roas)}</td>
      </tr>`).join('');

    // All campaigns table (paused too)
    const allCampaignRows = d.campaigns.map(c => `
      <tr>
        <td>
          <div class="td-name">${c.name}</div>
          <div class="td-sub">${(c.objective||'').replace('OUTCOME_','')}</div>
        </td>
        <td>${statusChip(c.status)}</td>
        <td>${money(c.spend || 0)}</td>
        <td>${shortNum(c.impressions)}</td>
        <td>${pct(c.ctr)}</td>
        <td>${fmt(c.purchases)}</td>
        <td>${money(c.cost_per_purchase)}</td>
        <td class="${roasColor(c.roas)}">${roas(c.roas)}</td>
      </tr>`).join('');

    document.getElementById('page').innerHTML = `
      <!-- KPIs -->
      <div class="section-title">Overview · ${d.date_preset.replace(/_/g,' ')}</div>
      <div class="kpi-grid space">${kpis}</div>

      <!-- Active campaigns -->
      <div class="section-title">Active Campaigns</div>
      <div class="campaign-grid space">${campaignCards}</div>

      <!-- Ad sets -->
      ${d.adsets.length ? `
      <div class="section-title">Active Ad Sets</div>
      <div class="table-card space">
        <div class="table-card-header">
          <div class="table-card-title">Ad Set Performance</div>
          <div class="table-card-meta">Ranked by spend · Last fetched ${new Date(d.fetched_at).toLocaleTimeString()}</div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Ad Set</th><th>Status</th><th>Spend</th><th>Impressions</th>
                <th>CTR</th><th>CPC</th><th>Freq</th><th>Purchases</th><th>Cost/Purch</th><th>ROAS</th>
              </tr>
            </thead>
            <tbody>${adsetRows}</tbody>
          </table>
        </div>
      </div>` : ''}

      <!-- All campaigns table -->
      <div class="section-title">All Campaigns (${d.campaigns.length} total)</div>
      <div class="table-card space">
        <div class="table-card-header">
          <div class="table-card-title">Full Campaign List</div>
          <div class="table-card-meta">${d.campaigns.filter(c=>c.status==='ACTIVE').length} active · ${pausedCount} paused</div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Campaign</th><th>Status</th><th>Spend</th><th>Impressions</th>
                <th>CTR</th><th>Purchases</th><th>Cost/Purch</th><th>ROAS</th>
              </tr>
            </thead>
            <tbody>${allCampaignRows}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  async function loadData(forceRefresh = false) {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.classList.add('spinning');

    if (!lastData) renderLoading();

    const datePreset = document.getElementById('dateSelect').value;

    try {
      const res = await fetch(`/api/dashboard?date_preset=${datePreset}&_=${Date.now()}`);
      const data = await res.json();

      if (data.error === 'NO_TOKEN') {
        renderNoToken();
      } else if (data.error) {
        renderError(data.message);
      } else {
        lastData = data;
        renderDashboard(data);
        document.getElementById('updatedAt').textContent =
          'Updated ' + new Date(data.fetched_at).toLocaleTimeString();
      }
    } catch (e) {
      renderError('Network error: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.classList.remove('spinning');
    }
  }

  // Load on page open
  loadData();
</script>
</body>
</html>
